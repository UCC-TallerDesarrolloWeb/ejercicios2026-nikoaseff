<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de productos</title>
    <link href="catalogo.css" type="text/css" rel="stylesheet">
</head>

<body>
    <body class="grid-container">
        <header class="item1">
            catalogo de productos
        </header>
        <nav class="item2">
            links de navegacion
        </nav>
        <aside class="item3">
            <fieldset>
                <legend>Buscar</legend>
                <label>Buscar</label>
                <input type="text" name="search" id="search" placeholder="Buscar.."
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                <label for="pricemin">Minimo</label>
                <input type="number" name="pricemin" id="pricemin" min="0">
                </p>
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                <label for="pricemax">Maximo</label>
                <input type="number" name="pricemax" id="pricemax" min="0">
                </p>
            </fieldset>
            <fieldset>
                <legend>Tipo de productos</legend>
                <p>
                    <input type="checkbox" name="tipo" id="tipo" placeholder="tipo....">
                    <label for="protectores">protectores</label>
                </p>
                   <p>
                    <input type="checkbox" name="tipo" id="tipo" placeholder="tipo....">
                    <label for="entrenamiento">entrenamiento</label>
                </p>
                   <p>
                    <input type="checkbox" name="tipo" id="tipo" placeholder="tipo....">
                    <label for="dobok">dobok</label>
                </p>
            </fieldset>
            
        </aside>
  <main class="item4">
    <div>
        <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" alt="dobok">
        <h3>Cabezal Cerrado</h3>
    </div>

    <div>
        <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp" alt="escudo-potencia">
        <h3>escudo-potencia/h3>
    </div>

    <div>
        <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" alt="foco-con-dedos">
        <h3>Foco con dedos</h3>
    </div>

    <div>
        <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-mano.webp" alt="protectores-mano">
        <h3>protectores-mano</h3>
    </div>

    <div>
        <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-pie.webp" alt="protectores-pie">
        <h3>protectores-mano</h3>
    </div>
  </main>
   <footer class="item5">
    contacto
   </footer> 
</body>
</html>
